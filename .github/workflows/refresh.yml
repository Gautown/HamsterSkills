name: refresh-skills

# 每日同步 GitHub 技能数据 → 构建 → 部署到 Cloudflare Workers（双站）
# 触发方式：
#   1. Cloudflare Worker Cron（主，见 wrangler.zh.jsonc）
#   2. repository_dispatch: refresh-request（同上 Worker 手动端点 /api/refresh）
#   3. schedule（兜底；GitHub 对公开仓库的定时任务可能延迟）
#   4. workflow_dispatch（手动）

on:
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-request]
  schedule:
    - cron: '23 3 * * *' # UTC 每日 03:23（北京时间 11:23）

permissions:
  contents: read

concurrency:
  group: refresh-skills
  cancel-in-progress: false

jobs:
  sync:
    name: 每日同步 GitHub 技能
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.sync.outputs.summary }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
      AI_API_BASE: ${{ vars.AI_API_BASE || 'https://api.agnes-ai.cn/v1' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL || 'agnes-3.0-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 恢复语料缓存（增量同步的关键）
        uses: actions/cache@v4
        with:
          path: |
            .cache/skills-remote
            .cache/ai-classify.json
          key: skills-corpus-${{ github.run_id }}
          restore-keys: |
            skills-corpus-

      - name: 同步（新增即写入、已有按 id 覆盖）
        id: sync
        run: npm run sync | tee sync-output.txt

      - name: AI 分类（记忆库命中的条目零成本，内容变更才重新调用）
        run: npm run ai-classify | tee ai-output.txt
        continue-on-error: true

      - name: 保存语料缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/skills-remote
            .cache/ai-classify.json
          key: skills-corpus-${{ github.run_id }}

      - name: 上传同步产物
        uses: actions/upload-artifact@v4
        with:
          name: skills-data
          path: data/skills.json
          retention-days: 7
          if-no-files-found: error

  refresh:
    name: 同步并部署
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Actions 自带令牌：api.github.com 1000 次/小时，足够 6 次搜索 + ≤300 次文件树
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 校验部署所需 Secrets
        run: |
          missing=""
          for v in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN SITE_URL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少必要的 Secrets：$missing（请在 Settings → Secrets 中配置）"
            exit 1
          fi
          echo "SITE_URL=$SITE_URL"

      - name: 安装依赖
        run: npm ci

      - name: 恢复语料缓存（增量同步的关键）
        uses: actions/cache@v4
        with:
          path: .cache/skills-remote
          key: skills-corpus-${{ github.run_id }}
          restore-keys: |
            skills-corpus-

      - name: 构建（含 GitHub 同步）
        run: npm run build

      - name: 切分双站资产
        run: npm run split

      - name: 聚合审计
        run: npm run audit | tee refresh-audit.txt

      - name: 部署中文站 Worker
        run: npm run deploy:zh

      - name: 部署英文站 Worker
        run: npm run deploy:en

      - name: 保存语料缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/skills-remote
          key: skills-corpus-${{ github.run_id }}