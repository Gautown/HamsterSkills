name: refresh-skills

# 每日同步 GitHub 技能数据 → 构建 → 部署到 Cloudflare Workers（双站）
# 触发方式：
#   1. Cloudflare Worker Cron（主，见 wrangler.zh.jsonc）
#   2. repository_dispatch: refresh-request（同上 Worker 手动端点 /api/refresh）
#   3. schedule（兜底；GitHub 对公开仓库的定时任务可能延迟）
#   4. workflow_dispatch（手动）
#
# 为什么构建要跑两次：
#   AI 分类记忆库是 loader 在「构建时」读取的，不重新构建就用不上新写入的结果。
#   只构建一次的话，AI 分类要等第二天才上线。
#   第二次构建时语料缓存已就位，未变更的仓库走 unchanged 分支、0 次网络请求，
#   只多花页面渲染时间，不多花 GitHub API 配额。

on:
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-request]
  schedule:
    - cron: '23 3 * * *' # UTC 每日 03:23（北京时间 11:23）

permissions:
  contents: read

concurrency:
  group: refresh-skills
  cancel-in-progress: false

env:
  # Actions 自带令牌：api.github.com 1000 次/小时，足够自动发现 + 逐仓拉文件树。
  # 不传则退化为匿名配额（60 次/小时），大量仓库会被静默跳过。
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SITE_URL: ${{ secrets.SITE_URL }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AI_API_BASE: ${{ vars.AI_API_BASE || 'https://api.agnes-ai.cn/v1' }}
  AI_API_KEY: ${{ secrets.AI_API_KEY }}
  AI_MODEL: ${{ vars.AI_MODEL || 'agnes-3.0-flash' }}

jobs:
  refresh:
    name: 同步并部署
    runs-on: ubuntu-latest
    # 构建×2 + AI 分类（首次全量回填约 35 分钟，之后接近 0）+ 双站上传
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 校验部署所需 Secrets
        run: |
          missing=""
          for v in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN SITE_URL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少必要的 Secrets：$missing（请在 Settings → Secrets and variables 中配置）"
            exit 1
          fi
          echo "SITE_URL=$SITE_URL"

      - name: 安装依赖
        run: npm ci

      # ---- 质量门禁：先验证代码本身，再花一小时去爬 GitHub ----
      # 此前这两个步骤都不在流水线里，161 个用例与类型检查只在本地跑过；
      # 一旦回归，站点会带着坏代码照常部署。
      - name: 单元测试
        run: npm test

      - name: 类型检查
        run: npm run check

      - name: 恢复语料缓存与 AI 记忆库
        uses: actions/cache@v4
        with:
          path: |
            .cache/skills-remote
            .cache/ai-classify.json
          # run_id 保证每次运行的 save 都不会撞 key；
          # restore-keys 让本次恢复「最近一次」写入的语料，实现增量聚合。
          #
          # CORPUS_CACHE_VERSION：语料格式的版本段。改动它即可让全部历史缓存失效 ——
          # 比逐个调 API 删缓存可靠（无需令牌、也不依赖 GitHub 的缓存清理接口），
          # 且旧缓存会随 GitHub 自身的过期策略自动回收。
          # 什么时候该 +1：语料文件结构变了、判定规则改了、
          # 或像本次这样要整体丢弃旧语料重新抓取。
          key: skills-corpus-v${{ vars.CORPUS_CACHE_VERSION || '2' }}-${{ github.run_id }}
          restore-keys: |
            skills-corpus-v${{ vars.CORPUS_CACHE_VERSION || '2' }}-

      # ---- 第一次构建：拉取/复用语料，并由 loader 写出技能清单 ----
      - name: 构建（写入技能清单）
        run: npm run build

      # ---- AI 分类：读清单 → 写记忆库 ----
      # 记忆库命中的条目零成本，只有新增或正文变更的才调用 API。
      # 未配置 AI_API_KEY 或调用失败时脚本自行跳过，规则层分类照常生效。
      - name: AI 分类
        # pipefail：管道的退出码默认取自最后一个命令（tee），
        # 那样 ai-classify 崩了也会被当成成功。日志照样留存，但失败必须传出去。
        run: set -o pipefail; npm run ai-classify | tee ai-output.txt

      # ---- 第二次构建：带上刚写入的 AI 分类，让它当次生效 ----
      - name: 构建（应用 AI 分类）
        run: npm run build

      - name: 切分双站资产
        run: npm run split

      # 审计现在会在覆盖率缺口或限流降级时以非 0 退出（见 scripts/audit.mjs 末尾），
      # 同样需要 pipefail 才能拦住部署。
      - name: 聚合审计
        run: set -o pipefail; npm run audit | tee refresh-audit.txt

      - name: 部署中文站 Worker
        run: npm run deploy:zh

      - name: 部署英文站 Worker
        run: npm run deploy:en

      # 必须放在部署之后：无论前面哪步失败，语料与记忆库都要留存，
      # 否则下次运行要重新爬取全部仓库、并为已知内容重复付费。
      - name: 保存语料缓存与 AI 记忆库
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/skills-remote
            .cache/ai-classify.json
          key: skills-corpus-v${{ vars.CORPUS_CACHE_VERSION || '2' }}-${{ github.run_id }}
